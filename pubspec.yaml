name: fridge
description: "냉장고 재료의 소진 임박일을 관리하고 메뉴를 추천한다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: 0.20.2
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - env.example
